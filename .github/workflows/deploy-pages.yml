name: Deploy Pages (site + hq)

on:
  push:
    branches: [main] # confirm this matches the repo's default branch
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: hq/package-lock.json

      - name: Install hq dependencies
        working-directory: hq
        run: npm ci

      - name: Build hq
        working-directory: hq
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      - name: Assemble combined site
        run: |
          mkdir -p _site
          cp *.html _site/
          cp -r images _site/
          mkdir -p _site/hq
          cp -r hq/dist/. _site/hq/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
