name: Butterflii launch checks
on:
  push:
    branches: [weekend-launch-2026-11-27, main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalogue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/catalogue.test.cjs
      - run: node --check gallery-render.js && node --check storefront.js && node --check contact.js
