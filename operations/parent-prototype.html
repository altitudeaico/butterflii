<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Butterflii parent workspace prototype</title><style>body{margin:0;background:#fff7fc;color:#321343;font:16px system-ui}header{background:#321343;color:white;padding:24px}main{max-width:900px;margin:auto;padding:20px}section{background:white;border:1px solid #e6cde9;border-radius:16px;padding:20px;margin-bottom:16px}label{display:block;margin:12px 0}input,select,button{font:inherit;padding:10px;box-sizing:border-box;max-width:100%}input,select{width:100%}button{background:#76249d;color:white;border:0;border-radius:8px;cursor:pointer}output{font-size:28px;font-weight:bold}article{border-top:1px solid #ddd;padding:12px 0}</style></head><body><header><h1>Butterflii Business Studio</h1><p>Offline parent workspace · demonstration only</p></header><main><p>Use fictional orders only. No customer information, real payments or live inventory updates. Records are lost when the page closes.</p><section><h2>Prepare a quotation</h2><form id="quote"><label>Artwork<select id="sku" required></select></label><label>Artwork price (£)<input id="price" type="number" min="0.01" max="100000" step=".01" required></label><label>Delivery (£)<input id="delivery" type="number" min="0" max="100000" step=".01" required></label><label>Destination<select id="region"><option>UK mainland</option><option>Northern Ireland or remote UK</option><option>Europe</option><option>USA or Canada</option><option>Rest of world</option></select></label><p>Quote total: <output id="total">£0.00</output></p><button>Create demo quote</button></form></section><section><h2>Demo orders and reservations</h2><p id="summary"></p><div id="orders"></div><p role="status" id="status"></p></section></main><script src="../catalogue.js"></script><script>
'use strict';const $=id=>document.getElementById(id),catalogue=window.ARTWORKS||{},orders=[];const money=n=>'£'+(n/100).toFixed(2);const pennies=id=>Math.round(Number($(id).value)*100);for(const [sku,p] of Object.entries(catalogue)){const o=document.createElement('option');o.value=sku;o.textContent=p.name+' · '+p.status;$('sku').append(o)}function updatePrice(){const p=catalogue[$('sku').value];$('price').value=p?p.price.replace('£',''):'';total()}function total(){$('total').textContent=money(pennies('price')+pennies('delivery'))}$('sku').onchange=updatePrice;$('quote').oninput=total;updatePrice();
const transitions={quoted:['reserved','cancelled'],reserved:['demo-paid','cancelled'],'demo-paid':['dispatched'],dispatched:[],cancelled:[]};function render(){const grid=$('orders');grid.replaceChildren();$('summary').textContent=orders.length+' demo quotes · '+money(orders.filter(o=>['demo-paid','dispatched'].includes(o.state)).reduce((s,o)=>s+o.total,0))+' simulated receipts';for(const o of orders){const a=document.createElement('article'),p=document.createElement('p');p.textContent=o.ref+' · '+catalogue[o.sku].name+' · '+money(o.total)+' · '+o.region+' · '+o.state;a.append(p);for(const next of transitions[o.state]){const b=document.createElement('button');b.type='button';b.textContent=next==='demo-paid'?'Simulate payment':next;b.style.marginRight='8px';b.onclick=()=>{if(next==='reserved'&&orders.some(x=>x!==o&&x.sku===o.sku&&['reserved','demo-paid','dispatched'].includes(x.state))){$('status').textContent='This artwork is already reserved or sold in this demo.';return}o.state=next;$('status').textContent='Demo status updated. No live changes.';render()};a.append(b)}grid.append(a)}}$('quote').onsubmit=e=>{e.preventDefault();if(!e.target.reportValidity()||!catalogue[$('sku').value])return;orders.push({ref:'DEMO-'+String(orders.length+1).padStart(3,'0'),sku:$('sku').value,total:pennies('price')+pennies('delivery'),region:$('region').value,state:'quoted'});render()};render();
</script></body></html>
