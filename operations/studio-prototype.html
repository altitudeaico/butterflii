<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Butterflii Studio prototype</title><style>body{font:16px system-ui;background:#fff7fc;color:#321343;margin:0}header{background:#321343;color:white;padding:24px}main{max-width:1000px;margin:auto;padding:20px}#grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}article{background:white;border:1px solid #e6cde9;border-radius:16px;padding:16px}img{width:100%;height:180px;object-fit:contain}label{display:block;margin:10px 0}input,select,button{font:inherit;padding:9px;max-width:100%;box-sizing:border-box}button{background:#76249d;color:white;border:0;border-radius:8px;cursor:pointer}input[type=number]{width:100%}</style><header><h1>Butterflii Creative Studio</h1><p>Offline review prototype · no live publishing</p></header><main><p>Review each painting together. Export your decisions for parent approval. Changes are not saved automatically and do not affect the website.</p><div id="grid"></div><p><button id="export">Export review decisions</button></p><p role="status" id="status"></p></main><script src="../catalogue.js"></script><script>
const grid=document.getElementById('grid'),records=[];
for(const [sku,p] of Object.entries(window.ARTWORKS||{})){const card=document.createElement('article');const img=document.createElement('img');img.src='../'+p.image;img.alt=p.name;const h=document.createElement('h2');h.textContent=p.name;const label=document.createElement('label');label.textContent='Proposed price (£)';const price=document.createElement('input');price.type='number';price.min='0.01';price.step='0.01';price.value=p.price.replace('£','');label.append(price);const choice=document.createElement('label');choice.textContent='Artist decision ';const select=document.createElement('select');for(const [v,t] of [['pending','Still deciding'],['sell','Offer for sale'],['display','Gallery only'],['exclude','Do not publish']]){const o=document.createElement('option');o.value=v;o.textContent=t;select.append(o)}choice.append(select);card.append(img,h,label,choice);grid.append(card);records.push({sku,price,select})}
document.getElementById('export').onclick=()=>{if(!records.length||records.some(r=>!r.price.checkValidity()||!r.price.value)){document.getElementById('status').textContent='Please check all prices and catalogue loading.';return}const data=records.map(r=>({sku:r.sku,proposed_price_gbp:Number(r.price.value),artist_decision:r.select.value,parent_approval:false}));const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='butterflii-artwork-review.json';a.click();URL.revokeObjectURL(url);document.getElementById('status').textContent='Review exported. No website changes made.'};
</script></html>
